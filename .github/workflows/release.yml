name: Release Build & GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify signed Release APK without publishing a GitHub Release'
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Verify Signed Release APK
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: '500M'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android NDK and CMake
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/26.3.11579264
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ndk-26.3.11579264-cmake-3.22.1

      - name: Set up Android NDK and CMake
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install ccache
        run: which ccache >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache)

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'tools/setup_native_deps.sh') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-

      - name: Cache llama.cpp source
        uses: actions/cache@v4
        with:
          path: tools/llama_cpp_src
          key: llama-cpp-${{ hashFiles('tools/setup_native_deps.sh') }}

      - name: Prepare Test Lexicon Assets
        run: |
          mkdir -p tools/mozc_dict
          if [ -f app/src/main/assets/mozc/connection_data.bin ] && [ ! -f tools/mozc_dict/connection_data.bin ]; then
            ln -sf ../../app/src/main/assets/mozc/connection_data.bin tools/mozc_dict/connection_data.bin
          fi
          if [ -f app/src/test/resources/mozc/system_dictionary.bin ] && [ ! -f tools/mozc_dict/system_dictionary.bin ]; then
            ln -sf ../../app/src/test/resources/mozc/system_dictionary.bin tools/mozc_dict/system_dictionary.bin
          fi

      - name: Setup Native Dependencies
        run: ./tools/setup_native_deps.sh

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --max-workers=2 --stacktrace

      - name: Extract & Verify Version Name
        id: version
        run: |
          VERSION_NAME=$(python3 -c '
          import re
          txt = open("app/build.gradle.kts", encoding="utf-8").read()
          m = re.search(r"versionName\s*=\s*\"([^\"]+)\"", txt)
          assert m, "versionName not found in app/build.gradle.kts"
          print(m.group(1))
          ')
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "${TAG_VERSION}" != "${VERSION_NAME}" ]; then
              echo "ERROR: Tag version (${TAG_VERSION}) does not match app/build.gradle.kts versionName (${VERSION_NAME})"
              exit 1
            fi
          fi
          echo "Verified versionName=${VERSION_NAME}"

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is not configured in 'release' environment."
            exit 1
          fi
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/jotinput-release.jks"
          chmod 600 "${RUNNER_TEMP}/jotinput-release.jks"

      - name: Assemble Signed Release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/jotinput-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ccache -z
          ./gradlew assembleRelease --max-workers=2 --stacktrace
          ccache -s

      - name: Verify APK Signature & 16KB ELF Page Alignment
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${APK_PATH}" ]; then
            echo "ERROR: Signed APK not found at ${APK_PATH}"
            exit 1
          fi
          APKSIGNER=$(ls -1 "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "${APKSIGNER}" ]; then
            echo "ERROR: apksigner not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          "${APKSIGNER}" verify --verbose --print-certs "${APK_PATH}"

          TMP_SO_DIR=$(mktemp -d)
          trap 'rm -rf "${TMP_SO_DIR}"' EXIT
          unzip -q "${APK_PATH}" "lib/arm64-v8a/*.so" -d "${TMP_SO_DIR}"
          python3 -c '
          import glob, subprocess, sys
          libs = sorted(glob.glob(sys.argv[1] + "/lib/arm64-v8a/*.so"))
          if not libs:
              print("ERROR: No arm64-v8a .so files found inside release APK", file=sys.stderr)
              sys.exit(1)
          for lib in libs:
              out = subprocess.check_output(["readelf", "-lW", lib], text=True)
              loads = [line.split()[-1] for line in out.splitlines() if line.strip().startswith("LOAD")]
              if not loads:
                  print(f"ERROR: No LOAD segments in {lib}", file=sys.stderr)
                  sys.exit(1)
              for align in loads:
                  val = int(align, 16)
                  if val < 0x4000 or (val % 0x4000) != 0:
                      print(f"ERROR: {lib} LOAD segment alignment {align} is not 16KB-aligned", file=sys.stderr)
                      sys.exit(1)
              print(f"OK {lib}: alignments={loads}")
          ' "${TMP_SO_DIR}"

      - name: Package Release Assets & Checksums
        run: |
          OUT_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "${OUT_DIR}"
          APK_NAME="jotinput-${{ steps.version.outputs.version_name }}-universal-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "${OUT_DIR}/${APK_NAME}"
          (cd "${OUT_DIR}" && sha256sum "${APK_NAME}" > SHA256SUMS.txt)
          cat "${OUT_DIR}/SHA256SUMS.txt"

      - name: Upload R8 Mapping Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Upload Signed Release Assets Artifact (Dry-Run Inspection)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.version.outputs.version_name }}
          path: ${{ runner.temp }}/release-assets/
          retention-days: 14
          compression-level: 0

      - name: Clean Up Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/jotinput-release.jks"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          OUT_DIR="${RUNNER_TEMP}/release-assets"
          APK_NAME="jotinput-${VERSION_NAME}-universal-release.apk"
          APK_PATH="${OUT_DIR}/${APK_NAME}"
          SUMS_PATH="${OUT_DIR}/SHA256SUMS.txt"
          NOTES_PATH="${OUT_DIR}/RELEASE_NOTES.md"
          cat > "${NOTES_PATH}" <<EOF
          ## JotInput ${TAG}

          - **Package ID**: \`io.github.kenichikurihara.jotinput\`
          - **Requirements**: Android 8.0+ (API 26+), \`arm64-v8a\` or \`x86_64\` (16KB ELF page-aligned)
          - **APK**: \`${APK_NAME}\`

          ### Installation & Verification
          1. Download \`${APK_NAME}\` and \`SHA256SUMS.txt\`.
          2. Verify integrity & signing certificate:
             \`\`\`bash
             sha256sum -c SHA256SUMS.txt
             apksigner verify --print-certs ${APK_NAME}
             \`\`\`
          3. Allow **Install unknown apps** when installing on Android (do not install over a Debug build without uninstalling first, as signing keys differ).
          4. Open **JotInput** and download speech/dictionary/swipe/SLM assets on demand from the **Home** / **Data** tabs.

          ### Supported Devices & Known Limitations
          - **Tier 1 (Maintainer-verified)**: Google Pixel 10 Pro & ChromeOS ARCVM.
          - **Tier 2 (Best-effort)**: Other AOSP-compatible Android 8.0+ \`arm64-v8a\` / \`x86_64\` devices.
          - **Unsupported**: 32-bit ABIs (\`armeabi-v7a\`, \`x86\`) and Android < 8.0.
          - Includes tokenless in-app updates (Release / Remote HEAD) on the **Home** tab with SHA-256 verification.

          See [\`CHANGELOG.md\`](https://github.com/kenichikurihara/jotinput/blob/main/CHANGELOG.md), [\`PRIVACY.md\`](https://github.com/kenichikurihara/jotinput/blob/main/PRIVACY.md), [\`NOTICE\`](https://github.com/kenichikurihara/jotinput/blob/main/NOTICE), and [\`SECURITY.md\`](https://github.com/kenichikurihara/jotinput/blob/main/SECURITY.md).

          ---
          EOF
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${APK_PATH}" "${SUMS_PATH}" --clobber
          else
            gh release create "${TAG}" "${APK_PATH}" "${SUMS_PATH}" \
              --title "JotInput ${TAG}" \
              --notes-file "${NOTES_PATH}" \
              --generate-notes
          fi
