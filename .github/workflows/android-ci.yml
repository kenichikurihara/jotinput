name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'eval/**'
      - 'LICENSES/**'
      - 'LICENSE'
      - '.agents/**'
      - '.githooks/**'
      - 'scripts/**'
      - 'deploy.sh'
      - 'download_model.sh'
      - 'tools/*.py'
      - 'tools/*.cc'
      - 'tools/*.tsv'
      - 'tools/*.jsonl'
      - 'tools/push_model_to_device.sh'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'eval/**'
      - 'LICENSES/**'
      - 'LICENSE'
      - '.agents/**'
      - '.githooks/**'
      - 'scripts/**'
      - 'deploy.sh'
      - 'download_model.sh'
      - 'tools/*.py'
      - 'tools/*.cc'
      - 'tools/*.tsv'
      - 'tools/*.jsonl'
      - 'tools/push_model_to_device.sh'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: '500M'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android NDK and CMake
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/26.3.11579264
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ndk-26.3.11579264-cmake-3.22.1

      - name: Set up Android NDK and CMake
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Install ccache
        run: which ccache >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ccache)

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'tools/setup_native_deps.sh') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-

      - name: Cache llama.cpp source
        uses: actions/cache@v4
        with:
          path: tools/llama_cpp_src
          key: llama-cpp-${{ hashFiles('tools/setup_native_deps.sh') }}

      - name: Prepare Test Lexicon Assets
        run: |
          mkdir -p tools/mozc_dict
          if [ -f app/src/main/assets/mozc/connection_data.bin ] && [ ! -f tools/mozc_dict/connection_data.bin ]; then
            ln -sf ../app/src/main/assets/mozc/connection_data.bin tools/mozc_dict/connection_data.bin
          fi
          if [ -f app/src/test/resources/mozc/system_dictionary.bin ] && [ ! -f tools/mozc_dict/system_dictionary.bin ]; then
            ln -sf ../app/src/test/resources/mozc/system_dictionary.bin tools/mozc_dict/system_dictionary.bin
          fi

      - name: Setup Native Dependencies
        run: ./tools/setup_native_deps.sh

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --max-workers=2 --stacktrace

      - name: Assemble Debug APK
        run: |
          ccache -z
          ./gradlew assembleDebug --max-workers=2 --stacktrace
          ccache -s

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 3

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          compression-level: 0
