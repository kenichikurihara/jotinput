name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'eval/**'
      - 'LICENSES/**'
      - 'LICENSE'
      - '.agents/**'
      - '.githooks/**'
      - 'scripts/**'
      - 'deploy.sh'
      - 'download_model.sh'
      - 'tools/*.py'
      - 'tools/*.cc'
      - 'tools/*.tsv'
      - 'tools/*.jsonl'
      - 'tools/push_model_to_device.sh'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: 'true'
  CCACHE_COMPRESSLEVEL: '6'
  CCACHE_MAXSIZE: '1G'
  CI_GRADLE_JVMARGS: '-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8'
  CI_KOTLIN_JVMARGS: '-Xmx2g -XX:+UseParallelGC'

jobs:
  detect-changes:
    name: Detect Changed Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
      doc_contract_changed: ${{ steps.scope.outputs.doc_contract_changed }}

    steps:
      - name: Classify Changed Files
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "doc_contract_changed=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event (${EVENT_NAME}): running full code + release checks."
            exit 0
          fi

          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > "${RUNNER_TEMP}/changed_files.txt"
          python3 - "${RUNNER_TEMP}/changed_files.txt" "${GITHUB_OUTPUT}" << 'EOF'
          import os, sys

          files_path, out_path = sys.argv[1], sys.argv[2]
          with open(files_path, encoding="utf-8") as f:
              files = [line.strip() for line in f if line.strip()]

          def is_doc_contract(p):
              return p in ("AGENTS.md", "GEMINI.md") or p.startswith("docs/ddd/")

          def is_pure_non_code(p):
              if p.startswith("docs/") and not p.startswith("docs/ddd/"):
                  return True
              if "/" not in p and p.endswith(".md") and p not in ("AGENTS.md", "GEMINI.md"):
                  return True
              if p.startswith("LICENSES/") or p in ("LICENSE", "NOTICE"):
                  return True
              if any(p.startswith(prefix) for prefix in (".agents/", ".githooks/", "eval/", "scripts/", "tools/eval/")):
                  return True
              if p in ("deploy.sh", "download_model.sh", "tools/push_model_to_device.sh"):
                  return True
              if p.startswith("tools/") and "/" not in p[len("tools/"):] and p.endswith((".py", ".cc", ".tsv", ".jsonl")):
                  return True
              return False

          code_changed = (len(files) == 0)
          doc_contract_changed = False
          for p in files:
              if is_doc_contract(p):
                  doc_contract_changed = True
              elif not is_pure_non_code(p):
                  code_changed = True

          with open(out_path, "a", encoding="utf-8") as out:
              out.write(f"code_changed={'true' if code_changed else 'false'}\n")
              out.write(f"doc_contract_changed={'true' if doc_contract_changed else 'false'}\n")

          print(f"Changed files ({len(files)}): code_changed={code_changed}, doc_contract_changed={doc_contract_changed}")
          for p in files[:50]:
              print(f"  - {p}")
          EOF

      - name: Checkout for Non-Code Syntax Checks
        if: steps.scope.outputs.code_changed == 'false'
        uses: actions/checkout@v4

      - name: Validate Changed Scripts Syntax
        if: steps.scope.outputs.code_changed == 'false'
        run: |
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sh|.githooks/*)
                echo "Checking bash syntax: $f"
                bash -n "$f"
                ;;
              *.py)
                echo "Checking Python syntax: $f"
                python3 -m py_compile "$f"
                ;;
            esac
          done < "${RUNNER_TEMP}/changed_files.txt"

  test-and-debug:
    name: Unit Tests & Debug APK
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true' || needs.detect-changes.outputs.doc_contract_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android Build Environment
        uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: ${{ github.ref == 'refs/heads/main' && 'on-success' || 'never' }}
          with-native: ${{ needs.detect-changes.outputs.code_changed }}

      - name: Decode Debug Keystore
        if: needs.detect-changes.outputs.code_changed == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
            printf '%s' "${DEBUG_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/jotinput-debug.keystore"
            chmod 600 "${RUNNER_TEMP}/jotinput-debug.keystore"
            echo "DEBUG_STORE_FILE=${RUNNER_TEMP}/jotinput-debug.keystore" >> "$GITHUB_ENV"
            echo "Configured persistent debug keystore for APK signing."
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "ERROR: DEBUG_KEYSTORE_BASE64 secret is missing on main branch push; refusing to publish ephemerally-signed app-debug.apk."
            exit 1
          else
            echo "Notice: DEBUG_KEYSTORE_BASE64 secret is unavailable (e.g. fork PR); falling back to AGP default debug keystore."
          fi

      - name: Run Unit Tests & Assemble Debug APK
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          ccache -z
          ./gradlew testDebugUnitTest assembleDebug --max-workers=4 --stacktrace \
            -Dorg.gradle.jvmargs="${CI_GRADLE_JVMARGS}" \
            -Dkotlin.daemon.jvmargs="${CI_KOTLIN_JVMARGS}"
          ccache -s

      - name: Run Contract & Architecture Unit Tests (Doc-Only PR)
        if: needs.detect-changes.outputs.code_changed != 'true'
        run: |
          ./gradlew testDebugUnitTest --max-workers=4 --stacktrace \
            -Dorg.gradle.jvmargs="${CI_GRADLE_JVMARGS}" \
            -Dkotlin.daemon.jvmargs="${CI_KOTLIN_JVMARGS}"

      - name: Verify Debug APK Signature
        if: needs.detect-changes.outputs.code_changed == 'true'
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(ls -1 "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "${APKSIGNER}" ]; then
            echo "ERROR: apksigner not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          VERIFY_OUT=$("${APKSIGNER}" verify --verbose --print-certs "${APK_PATH}")
          printf '%s\n' "${VERIFY_OUT}"
          if [ -n "${DEBUG_STORE_FILE:-}" ] && [ -f "${DEBUG_STORE_FILE}" ]; then
            EXPECTED_SHA256=$(keytool -J-Duser.language=en -list -v \
              -keystore "${DEBUG_STORE_FILE}" \
              -storepass "${DEBUG_STORE_PASSWORD:-android}" \
              -alias "${DEBUG_KEY_ALIAS:-androiddebugkey}" | \
              awk -F': ' '/^[[:space:]]*SHA256:/ {gsub(/[^0-9a-fA-F]/, "", $2); print tolower($2); exit}')
            ACTUAL_SHA256=$(printf '%s\n' "${VERIFY_OUT}" | \
              awk -F'certificate SHA-256 digest:' '/certificate SHA-256 digest:/ && !/public key/ {gsub(/[^0-9a-fA-F]/, "", $2); print tolower($2); exit}')
            if [ -z "${EXPECTED_SHA256}" ] || [ "${EXPECTED_SHA256}" != "${ACTUAL_SHA256}" ]; then
              echo "ERROR: Debug APK signing certificate mismatch (expected=${EXPECTED_SHA256}, actual=${ACTUAL_SHA256})"
              exit 1
            fi
            echo "Verified debug APK signing certificate matches persistent debug keystore (${ACTUAL_SHA256})."
          fi

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 3

      - name: Upload Debug APK
        if: success() && needs.detect-changes.outputs.code_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          compression-level: 0

      - name: Clean Up Debug Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/jotinput-debug.keystore"

  verify-release:
    name: Release Build (R8 & LintVital)
    needs: detect-changes
    if: needs.detect-changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android Build Environment
        uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: ${{ github.ref == 'refs/heads/main' && 'on-success' || 'never' }}
          with-native: 'true'

      - name: Verify Release Build (R8 & LintVital)
        run: |
          ccache -z
          ./gradlew assembleRelease --max-workers=4 --stacktrace \
            -Dorg.gradle.jvmargs="${CI_GRADLE_JVMARGS}" \
            -Dkotlin.daemon.jvmargs="${CI_KOTLIN_JVMARGS}"
          ccache -s

      - name: Verify 16KB ELF Page Alignment (arm64-v8a)
        run: |
          python3 -c '
          import glob, subprocess, sys
          libs = sorted(glob.glob("app/build/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib/arm64-v8a/*.so"))
          if not libs:
              print("ERROR: No stripped arm64-v8a .so files found", file=sys.stderr)
              sys.exit(1)
          for lib in libs:
              out = subprocess.check_output(["readelf", "-lW", lib], text=True)
              loads = [line.split()[-1] for line in out.splitlines() if line.strip().startswith("LOAD")]
              if not loads:
                  print(f"ERROR: No LOAD segments in {lib}", file=sys.stderr)
                  sys.exit(1)
              for align in loads:
                  val = int(align, 16)
                  if val < 0x4000 or (val % 0x4000) != 0:
                      print(f"ERROR: {lib} LOAD segment alignment {align} is not 16KB-aligned", file=sys.stderr)
                      sys.exit(1)
              print(f"OK {lib}: alignments={loads}")
          '

      - name: Upload Unsigned Release APK (main only)
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
          compression-level: 0

  build-and-test:
    name: Build & Test
    needs: [detect-changes, test-and-debug, verify-release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify Required CI Gate Results
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          CODE_CHANGED: ${{ needs.detect-changes.outputs.code_changed }}
          DOC_CONTRACT_CHANGED: ${{ needs.detect-changes.outputs.doc_contract_changed }}
          TEST_RESULT: ${{ needs.test-and-debug.result }}
          RELEASE_RESULT: ${{ needs.verify-release.result }}
        run: |
          echo "detect-changes=${DETECT_RESULT} code_changed=${CODE_CHANGED} doc_contract_changed=${DOC_CONTRACT_CHANGED}"
          echo "test-and-debug=${TEST_RESULT} verify-release=${RELEASE_RESULT}"
          if [ "${DETECT_RESULT}" != "success" ]; then
            echo "ERROR: detect-changes did not succeed (${DETECT_RESULT})"
            exit 1
          fi
          if [ "${CODE_CHANGED}" = "true" ]; then
            if [ "${TEST_RESULT}" != "success" ] || [ "${RELEASE_RESULT}" != "success" ]; then
              echo "ERROR: Required code checks failed (test-and-debug=${TEST_RESULT}, verify-release=${RELEASE_RESULT})"
              exit 1
            fi
          elif [ "${DOC_CONTRACT_CHANGED}" = "true" ]; then
            if [ "${TEST_RESULT}" != "success" ]; then
              echo "ERROR: Contract unit tests failed (test-and-debug=${TEST_RESULT})"
              exit 1
            fi
          fi
          echo "All required Android CI checks passed."

  publish-head:
    name: Publish Remote HEAD Prerelease
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Built APK Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: ${{ runner.temp }}/head-artifacts

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is missing in 'release' environment."
            exit 1
          fi
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/jotinput-release.jks"
          chmod 600 "${RUNNER_TEMP}/jotinput-release.jks"

      - name: Zipalign & Sign Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          UNSIGNED_APK="${RUNNER_TEMP}/head-artifacts/app-release-unsigned/app-release-unsigned.apk"
          if [ ! -f "${UNSIGNED_APK}" ]; then
            echo "ERROR: Unsigned release APK not found at ${UNSIGNED_APK}"
            exit 1
          fi
          BUILD_TOOLS_DIR=$(ls -1d "${ANDROID_HOME}"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          if [ ! -x "${ZIPALIGN}" ] || [ ! -x "${APKSIGNER}" ]; then
            echo "ERROR: zipalign or apksigner not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi

          ALIGNED_APK="${RUNNER_TEMP}/app-release-aligned.apk"
          SIGNED_APK="${RUNNER_TEMP}/app-release.apk"
          if "${ZIPALIGN}" --help 2>&1 | grep -q -- '-P'; then
            "${ZIPALIGN}" -P 16 -f 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"
          else
            "${ZIPALIGN}" -p -f 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"
          fi
          "${ZIPALIGN}" -c 4 "${ALIGNED_APK}"

          "${APKSIGNER}" sign \
            --ks "${RUNNER_TEMP}/jotinput-release.jks" \
            --ks-pass "env:RELEASE_STORE_PASSWORD" \
            --ks-key-alias "${RELEASE_KEY_ALIAS}" \
            --key-pass "env:RELEASE_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"
          rm -f "${ALIGNED_APK}"

      - name: Verify Signed Release & Debug APKs
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          RELEASE_APK="${RUNNER_TEMP}/app-release.apk"
          DEBUG_APK="${RUNNER_TEMP}/head-artifacts/app-debug/app-debug.apk"
          APKSIGNER=$(ls -1 "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "${APKSIGNER}" ]; then
            echo "ERROR: apksigner not found under ${ANDROID_HOME}/build-tools"
            exit 1
          fi
          VERIFY_REL=$("${APKSIGNER}" verify --verbose --print-certs "${RELEASE_APK}")
          printf '%s\n' "${VERIFY_REL}"
          EXPECTED_REL_SHA256=$(keytool -J-Duser.language=en -list -v \
            -keystore "${RUNNER_TEMP}/jotinput-release.jks" \
            -storepass "${RELEASE_STORE_PASSWORD}" \
            -alias "${RELEASE_KEY_ALIAS}" | \
            awk -F': ' '/^[[:space:]]*SHA256:/ {gsub(/[^0-9a-fA-F]/, "", $2); print tolower($2); exit}')
          ACTUAL_REL_SHA256=$(printf '%s\n' "${VERIFY_REL}" | \
            awk -F'certificate SHA-256 digest:' '/certificate SHA-256 digest:/ && !/public key/ {gsub(/[^0-9a-fA-F]/, "", $2); print tolower($2); exit}')
          if [ -z "${EXPECTED_REL_SHA256}" ] || [ "${EXPECTED_REL_SHA256}" != "${ACTUAL_REL_SHA256}" ]; then
            echo "ERROR: Release APK signing certificate mismatch (expected=${EXPECTED_REL_SHA256}, actual=${ACTUAL_REL_SHA256})"
            exit 1
          fi
          echo "Verified release APK signing certificate matches release keystore (${ACTUAL_REL_SHA256})."

          "${APKSIGNER}" verify --verbose --print-certs "${DEBUG_APK}"

          TMP_SO_DIR=$(mktemp -d)
          trap 'rm -rf "${TMP_SO_DIR}"' EXIT
          unzip -q "${RELEASE_APK}" "lib/arm64-v8a/*.so" -d "${TMP_SO_DIR}"
          python3 -c '
          import glob, subprocess, sys
          libs = sorted(glob.glob(sys.argv[1] + "/lib/arm64-v8a/*.so"))
          if not libs:
              print("ERROR: No arm64-v8a .so files found inside release APK", file=sys.stderr)
              sys.exit(1)
          for lib in libs:
              out = subprocess.check_output(["readelf", "-lW", lib], text=True)
              loads = [line.split()[-1] for line in out.splitlines() if line.strip().startswith("LOAD")]
              for align in loads:
                  val = int(align, 16)
                  if val < 0x4000 or (val % 0x4000) != 0:
                      print(f"ERROR: {lib} LOAD segment alignment {align} is not 16KB-aligned", file=sys.stderr)
                      sys.exit(1)
              print(f"OK {lib}: alignments={loads}")
          ' "${TMP_SO_DIR}"

      - name: Clean Up Release Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/jotinput-release.jks"

      - name: Package Remote HEAD Assets & Metadata
        run: |
          OUT_DIR="${RUNNER_TEMP}/head-release-assets"
          mkdir -p "${OUT_DIR}"
          cp "${RUNNER_TEMP}/app-release.apk" "${OUT_DIR}/jotinput-main-head-release.apk"
          cp "${RUNNER_TEMP}/head-artifacts/app-debug/app-debug.apk" "${OUT_DIR}/jotinput-main-head-debug.apk"
          (cd "${OUT_DIR}" && sha256sum jotinput-main-head-release.apk jotinput-main-head-debug.apk > SHA256SUMS.txt)
          OUT_DIR="${OUT_DIR}" python3 -c '
          import hashlib, json, os, re, subprocess, time

          gradle_txt = open("app/build.gradle.kts", encoding="utf-8").read()
          version_name = re.search(r"versionName\s*=\s*\"([^\"]+)\"", gradle_txt).group(1)
          version_code = int(re.search(r"versionCode\s*=\s*(\d+)", gradle_txt).group(1))
          commit_epoch_sec = int(subprocess.check_output(["git", "show", "-s", "--format=%ct", "HEAD"], text=True).strip())
          out_dir = os.environ["OUT_DIR"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "main-head"

          def file_info(filename):
              path = os.path.join(out_dir, filename)
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
              return {
                  "name": filename,
                  "downloadUrl": f"https://github.com/{repo}/releases/download/{tag}/{filename}",
                  "sizeBytes": os.path.getsize(path),
                  "sha256": h.hexdigest(),
              }

          meta = {
              "schemaVersion": 1,
              "tag": tag,
              "branch": "main",
              "gitSha": os.environ["GITHUB_SHA"],
              "commitEpochMs": commit_epoch_sec * 1000,
              "publishedAtMs": int(time.time() * 1000),
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "versionName": version_name,
              "versionCode": version_code,
              "releaseApk": file_info("jotinput-main-head-release.apk"),
              "debugApk": file_info("jotinput-main-head-debug.apk"),
          }
          with open(os.path.join(out_dir, "head-metadata.json"), "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)
              f.write("\n")
          print(json.dumps(meta, indent=2))
          '

      - name: Publish Rolling Remote HEAD Prerelease (main-head)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT_DIR="${RUNNER_TEMP}/head-release-assets"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NOTES_PATH="${OUT_DIR}/HEAD_NOTES.md"
          cat > "${NOTES_PATH}" <<EOF
          ## JotInput Remote HEAD (\`${SHORT_SHA}\`)

          Rolling prerelease built automatically from \`main\` (Run \`#${GITHUB_RUN_ID}\`, commit \`${GITHUB_SHA}\`).
          Used by the tokenless **Remote HEAD** channel in JotInput's in-app updater (does not replace official \`/releases/latest\`).

          - \`jotinput-main-head-release.apk\`: Signed Release build (for Release installs)
          - \`jotinput-main-head-debug.apk\`: Persistent-Debug-key signed build (for Debug installs)
          - \`head-metadata.json\`: Machine-readable freshness & SHA-256 verification manifest
          - \`SHA256SUMS.txt\`: Checksum manifest
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f main-head "${GITHUB_SHA}"
          git push origin "refs/tags/main-head" --force

          if gh release view main-head >/dev/null 2>&1; then
            gh release upload main-head \
              "${OUT_DIR}/jotinput-main-head-release.apk" \
              "${OUT_DIR}/jotinput-main-head-debug.apk" \
              "${OUT_DIR}/SHA256SUMS.txt" \
              --clobber
            gh release upload main-head "${OUT_DIR}/head-metadata.json" --clobber
            gh release edit main-head \
              --title "JotInput Remote HEAD (main)" \
              --notes-file "${NOTES_PATH}" \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
          else
            gh release create main-head \
              "${OUT_DIR}/jotinput-main-head-release.apk" \
              "${OUT_DIR}/jotinput-main-head-debug.apk" \
              "${OUT_DIR}/SHA256SUMS.txt" \
              --title "JotInput Remote HEAD (main)" \
              --notes-file "${NOTES_PATH}" \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
            gh release upload main-head "${OUT_DIR}/head-metadata.json" --clobber
          fi
